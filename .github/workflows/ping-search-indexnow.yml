name: IndexNow ping

# Companion to index-new-articles.yml (Google). Tells the IndexNow engines
# (Bing, Yandex, Seznam, Naver… — the index that most AI answer engines read
# from) that a page changed.
#
# Three entry points, because "a page changed" happens in three different ways:
#
#   1. new-pages    — a push adds a blog article or a hot-topic question page.
#                     Waits for the new URL to appear in the sitemap, then pings
#                     only the URLs this push created.
#   2. refresh-core — a deploy succeeded and that deploy touched shared data or
#                     page components. The evergreen pages (home, candidates,
#                     themes, hubs) keep the same URL, so nothing new shows up in
#                     the sitemap and job 1 never fires for them. Without this,
#                     the search index keeps serving a year-old copy of the
#                     homepage — which is how AI answers ended up quoting an old
#                     question and candidate count.
#   3. resubmit-all — manual. Pings every URL of the sitemap. Use it once after
#                     a large redesign or to repair a stale index.
#
# IndexNow authenticates by a KEY FILE hosted on the domain: search engines
# fetch https://www.quizz-du-berger.com/<key>.txt and check it contains the key.
# server.mjs serves that file from the INDEXNOW_KEY env var, so the key must be
# set in TWO places (same value):
#   - repo secret INDEXNOW_KEY   — so this workflow can submit.
#   - VPS .env  INDEXNOW_KEY=...  — so /<key>.txt is served for verification.
#
# If the INDEXNOW_KEY secret is absent, every job is a no-op and succeeds.
# Nothing to configure = nothing happens, no red X.
#
# Generate a key with:  openssl rand -hex 16

on:
  push:
    branches: [main]
    paths:
      - "app-tanstack/src/content/articles/**"
      - "app-tanstack/src/utils/seo.ts"
  workflow_run:
    workflows: ["Quizz du Berger Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      scope:
        description: "What to resubmit"
        required: true
        default: core
        type: choice
        options:
          - core
          - all

concurrency:
  group: indexnow-ping
  cancel-in-progress: false

env:
  BASE_URL: https://www.quizz-du-berger.com
  HOST: www.quizz-du-berger.com

jobs:
  # ---------------------------------------------------------------------------
  # 1. URLs created by this push (blog articles, hot-topic question pages)
  # ---------------------------------------------------------------------------
  new-pages:
    name: Ping IndexNow with new URLs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check that an IndexNow key is configured
        id: gate
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY secret is not set — skipping IndexNow ping (nothing to do)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0 # need github.event.before to diff the push

      - name: Extract slugs added by this push
        id: slugs
        if: steps.gate.outputs.enabled == 'true'
        run: |
          BEFORE="${{ github.event.before }}"
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^)"
          fi
          added_slugs() {
            git diff "$BEFORE" "${{ github.sha }}" -- "$1" \
              | grep -E '^\+' | grep -oE "slug: '[^']+'" \
              | sed "s/^slug: '//; s/'$//" || true
          }
          # One file per article, named {slug}.ts — the added file names ARE the
          # new blog slugs.
          added_article_slugs() {
            git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" \
              -- 'app-tanstack/src/content/articles/*.ts' \
              | grep -v '/index\.ts$' \
              | sed 's#.*/##; s#\.ts$##' || true
          }
          urls=""
          for slug in $(added_article_slugs); do
            urls="$urls $BASE_URL/blog/$slug"
          done
          # seo.ts also contains comparison-pair slugs; non-question matches are
          # filtered out by the sitemap check in the next step.
          for slug in $(added_slugs app-tanstack/src/utils/seo.ts); do
            urls="$urls $BASE_URL/question-politique/$slug"
          done
          urls="$(echo "$urls" | xargs -n1 | sort -u | xargs || true)"
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
          if [ -z "$urls" ]; then
            echo "No new article/question slugs in this push — nothing to ping."
          else
            echo "Candidate new URLs: $urls"
          fi

      - name: Wait for the deploy to publish the new URLs in the sitemap
        id: live
        if: steps.gate.outputs.enabled == 'true' && steps.slugs.outputs.urls != ''
        run: |
          # The sitemap is rebuilt from this same commit during the VPS deploy,
          # so as soon as one new URL appears, the deploy is done and every
          # valid URL of this push is in it (leftover misses are false
          # positives from the slug extraction, e.g. comparison pairs).
          # Only sitemap-confirmed URLs are passed on for indexing.
          for i in $(seq 1 90); do
            sitemap="$(curl -sf "$BASE_URL/sitemap.xml" || true)"
            found=""
            missing=""
            for url in ${{ steps.slugs.outputs.urls }}; do
              if echo "$sitemap" | grep -qF "<loc>$url</loc>"; then
                found="$found $url"
              else
                missing="$missing $url"
              fi
            done
            if [ -n "$found" ]; then
              echo "Live in sitemap:$found"
              [ -n "$missing" ] && echo "Not in sitemap (ignored):$missing"
              echo "urls=$(echo "$found" | xargs)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Deploy not live yet ($i/90), retrying in 20s..."
            sleep 20
          done
          echo "Timed out: none of the new URLs appeared in the sitemap." >&2
          exit 1

      - name: Ping IndexNow with the new URLs only
        if: steps.gate.outputs.enabled == 'true' && steps.live.outputs.urls != ''
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: bash .github/scripts/indexnow-submit.sh ${{ steps.live.outputs.urls }}

  # ---------------------------------------------------------------------------
  # 2. Evergreen pages, after a deploy that touched the data behind them
  # ---------------------------------------------------------------------------
  refresh-core:
    name: Refresh evergreen pages after a deploy
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check that an IndexNow key is configured
        id: gate
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY secret is not set — skipping IndexNow ping (nothing to do)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2 # enough to diff the deployed commit against its parent

      - name: Did this deploy touch anything the evergreen pages render?
        id: touched
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # A deploy runs on every push to main, but most pushes change nothing
          # the candidate/theme/hub pages display. IndexNow asks for changed
          # URLs only, so filter on the diff of the deployed commit.
          # A push of several commits at once only exposes the last one here;
          # the miss is harmless, the next data change pings the same pages.
          if ! changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null)"; then
            echo "Cannot diff (first commit or shallow history) — refreshing anyway."
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^app-tanstack/src/(shared|content|pages|components|utils)/'; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing that changes an evergreen page — skipping."
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the evergreen URL list from the live sitemap
        id: urls
        if: steps.gate.outputs.enabled == 'true' && steps.touched.outputs.refresh == 'true'
        run: |
          # The sitemap is rebuilt during the deploy that just succeeded, so it
          # already reflects this commit. Take the hubs plus every candidate,
          # theme and party page from it — those are the pages whose content
          # changes while their URL stays the same.
          sitemap="$(curl -sf "$BASE_URL/sitemap.xml")"
          all="$(echo "$sitemap" | grep -oE '<loc>[^<]+</loc>' | sed 's#</\?loc>##g')"
          hubs="$BASE_URL/
          $BASE_URL/themes
          $BASE_URL/all-questions
          $BASE_URL/candidats
          $BASE_URL/partis
          $BASE_URL/sujets
          $BASE_URL/comparer
          $BASE_URL/comparateur-programmes-2027
          $BASE_URL/sondages-presidentielle-2027
          $BASE_URL/qui-est-candidat-2027
          $BASE_URL/blog"
          detail="$(echo "$all" | grep -E '/(candidat|theme|parti|candidature)/' || true)"
          printf '%s\n%s\n' "$hubs" "$detail" | tr -d ' ' | sed '/^$/d' | sort -u > /tmp/indexnow-core.txt
          echo "$(wc -l < /tmp/indexnow-core.txt | tr -d ' ') evergreen URLs to refresh."

      - name: Ping IndexNow
        if: steps.gate.outputs.enabled == 'true' && steps.touched.outputs.refresh == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: bash .github/scripts/indexnow-submit.sh < /tmp/indexnow-core.txt

  # ---------------------------------------------------------------------------
  # 3. Manual resubmission — repair a stale index
  # ---------------------------------------------------------------------------
  resubmit:
    name: Resubmit ${{ inputs.scope }} URLs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check that an IndexNow key is configured
        id: gate
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY secret is not set — nothing to submit." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Collect URLs from the live sitemap
        run: |
          sitemap="$(curl -sf "$BASE_URL/sitemap.xml")"
          all="$(echo "$sitemap" | grep -oE '<loc>[^<]+</loc>' | sed 's#</\?loc>##g')"
          if [ "${{ inputs.scope }}" = "all" ]; then
            echo "$all" > /tmp/indexnow-manual.txt
          else
            printf '%s\n' "$BASE_URL/" > /tmp/indexnow-manual.txt
            echo "$all" | grep -E '/(candidat|theme|parti|candidature)/|/(themes|all-questions|candidats|partis|sujets|comparer|blog|comparateur-programmes-2027|sondages-presidentielle-2027|qui-est-candidat-2027)$' >> /tmp/indexnow-manual.txt
          fi
          sort -u -o /tmp/indexnow-manual.txt /tmp/indexnow-manual.txt
          echo "$(wc -l < /tmp/indexnow-manual.txt | tr -d ' ') URLs selected for scope '${{ inputs.scope }}'."

      - name: Ping IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: bash .github/scripts/indexnow-submit.sh < /tmp/indexnow-manual.txt

  notify-failure:
    name: Notify Slack on failure
    needs: [new-pages, refresh-core, resubmit]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set; skipping notification."
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          PAYLOAD=$(jq -nc \
            --arg text ":x: *Quizz du Berger* — IndexNow ping failed on \`$REF\` (commit \`$SHORT_SHA\` by $ACTOR)\n<$RUN_URL|See workflow run>" \
            '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
